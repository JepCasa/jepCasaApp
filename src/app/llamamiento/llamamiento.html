<section class="llamamiento-container">

  <!-- Decoración de fondo -->
  <div class="blur blur-1"></div>
  <div class="blur blur-2"></div>

  <main class="mensaje-box">

    <div class="badge">
      <i class="bi bi-heart-fill"></i>
      Un mensaje para vos
    </div>

    <h1 class="mensaje-titulo">
      {{ mensajeTitulo }}
    </h1>

    <p class="mensaje-subtitulo">
      {{ mensajeSubtitulo }}
    </p>

    <!-- CARRUSEL -->
    <div class="versiculo-container">

      <button class="flecha izquierda" (click)="anterior()" aria-label="Versículo anterior">
        ‹
      </button>

      <div class="versiculo" [class.cambiando]="animando">

        <div class="comillas">“</div>

        <p class="texto-versiculo">
          {{ versiculos[indiceActual].texto }}
        </p>

        <span class="referencia">
          {{ versiculos[indiceActual].referencia }}
        </span>

      </div>

      <button class="flecha derecha" (click)="siguiente()" aria-label="Siguiente versículo">
        ›
      </button>

    </div>

    <!-- Indicadores -->
    <div class="indicadores">
      <span *ngFor="let versiculo of versiculos; let i = index" [class.activo]="i === indiceActual" (click)="irA(i)">
      </span>
    </div>

    <p class="prrafo-adicional">
      {{ prrafoAdicional }}
    </p>

    <div class="mensaje-final">
      <i class="bi bi-stars"></i>
      <p>
        Jesús te está llamando hoy.
        <strong>No es casualidad que estés acá.</strong>
      </p>
    </div>

    <a [routerLink]="['/']" class="btn btn-primary">
      <i class="bi bi-house-heart-fill"></i>
      Conocer la Iglesia JEP
    </a>

  </main>

  <footer>
    Iglesia JEP · Jesús Es mi Pastor © 2025
  </footer>

</section>
