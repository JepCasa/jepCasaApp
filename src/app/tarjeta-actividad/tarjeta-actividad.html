<article class="actividad-card" [style.border-top-color]="actividad().colorTitulo || '#1e3a8a'">
  <div class="actividad-imagen-contenedor">
    <img [src]="actividad().imagen" [alt]="actividad().titulo" class="actividad-imagen" />
  </div>
  <div class="actividad-contenido">
    <h3 class="actividad-titulo" [style.color]="actividad().colorTitulo || '#1e3a8a'">
      {{ actividad().titulo }}
    </h3>
    <p class="actividad-descripcion" [innerHTML]="actividad().descripcion"></p>
    
    <div class="actividad-enlaces">
      @if (actividad().enlaceInstagram) {
        <a [href]="actividad().enlaceInstagram" target="_blank" class="btn-instagram">
          <i class="bi bi-instagram"></i>
          {{ actividad().titulo.split(' ')[0] }}
        </a>
      }
      
      @if (actividad().enlaceMapa) {
        <a [href]="actividad().enlaceMapa" target="_blank" class="btn-mapa">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8 2 2 8 2 12c0 3.7 2.7 7.5 8 11.5.7.6 1.3.6 2 0 5.3-4 8-7.8 8-11.5C22 6 16 2 12 2zm0 2c3.9 0 7 3.1 7 7 0 2.6-1.9 5.4-6.8 9.8-1.8 1.5-3.3 2.2-4.2 2.2-.9 0-2.4-.7-4.2-2.2C5.9 16.4 7 13.6 7 11c0-3.9 3.1-7 7-7zm0 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 8c-2.2 0-4-1.8-4-4 0-.1 0-.2.1-.3.9-1.5 2.4-2.4 4.1-2.4s3.1.9 4.1 2.4c.1.1.2.3.2.4 0 2.2-1.8 4-4 4z"/>
          </svg>
          Cómo llegar
        </a>
      }
    </div>
  </div>
</article>
