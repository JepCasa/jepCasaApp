<section class="hero">

    <div class="hero-contenido">

        <div class="hero-texto">

            <span class="badge">
                Bienvenido a JEP
            </span>

            <h2>
                Descubre todas las actividades de la iglesia
            </h2>

            <p>
                Cada semana compartimos reuniones, encuentros y actividades para todas las edades.
                Queremos que encuentres un lugar donde crecer en la fe y conocer nuevas personas.
            </p>

            <div class="hero-botones">

                <a
                    href="#actividades"
                    class="btn btn-principal">

                    Ver actividades

                </a>

                <a
                    [routerLink]="['/llamamiento']"
                    class="btn btn-secundario">

                    Mensaje para ti 💌

                </a>

            </div>

        </div>

        <div class="hero-imagen">

            <img
                src="images/jepcasa2.jpg"
                alt="Iglesia JEP">

        </div>

    </div>

</section>
