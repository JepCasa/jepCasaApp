<section class="hero-section">
  <div class="hero-content">
    <div class="hero-text">
      <h2 class="hero-badge">Bienvenido a JEP</h2>
      <h1 class="hero-title">Descubre todas las actividades de la iglesia</h1>
      <p class="hero-description">
        Cada semana ofrecemos espacios de encuentro, crecimiento y comunidad para todas las edades.
        ¡Únete a nosotros en este camino de fe y servicio juntos!
      </p>
      <div class="hero-actions">
        <a href="#actividades" class="btn btn-primary btn-lg">
          Explorar Actividades
        </a>
        <a [routerLink]="['/llamamiento']" class="btn btn-outline">
          Mensaje para ti 💌
        </a>
      </div>
    </div>
    <div class="hero-visual">
      <div class="hero-image-wrapper">
        <img src="images/jepcasa2.jpg" alt="Reunión General" class="hero-image" />
      </div>
    </div>
  </div>
</section>
